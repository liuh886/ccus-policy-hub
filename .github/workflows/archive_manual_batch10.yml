name: IPCC 2019 Refinement complete-source archive batch 10
on:
  push:
    paths:
      - '.github/workflows/archive_manual_batch10.yml'
      - 'tools/source_archive/manual_acquisition_batch10.csv'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download complete IPCC original package and hash
        run: POLICY_OUTPUT=policy_source_evidence_batch10 python tools/source_archive/manual_acquire_batch10.py tools/source_archive/manual_acquisition_batch10.csv
      - name: Preserve original ZIP and manifest
        uses: actions/upload-artifact@v4
        with:
          name: policy-source-evidence-batch10
          path: policy_source_evidence_batch10/
          retention-days: 7
          if-no-files-found: error
