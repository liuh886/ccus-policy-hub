name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-scope:
    runs-on: ubuntu-latest
    outputs:
      governed_data: ${{ steps.scope.outputs.governed_data }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify changed authority layer
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "governed_data=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only "$BASE_SHA" "$GITHUB_SHA" > changed-files.txt
          cat changed-files.txt
          # Generated projections (src/content/*, public/data, src/data) are no
          # longer committed: they are pure functions of the SQLite SSOT and
          # are regenerated with `pnpm gen`. Watch the generators instead.
          if grep -Eq '^(agent/ccus-ai-agent/(db|logic|migrations|governance)/|src/content/(config\.ts|enums\.generated\.ts)|src/data/countries\.json|docs/policy-(db-consistency|coverage|content-depth)|scripts/(export|generate|sync-policy|audit-policy|manage-db|content-export-utils|lib/)|.*\.(db|sqlite|sql)$|package\.json$|pnpm-lock\.yaml$|\.github/workflows/ci\.yml$)' changed-files.txt; then
            echo "governed_data=true" >> "$GITHUB_OUTPUT"
          else
            echo "governed_data=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Fast quality and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate derived content from SQLite SSOT
        run: pnpm gen

      - name: ESLint
        run: pnpm eslint .

      - name: Prettier Check
        run: pnpm prettier --check .

      - name: Test
        run: pnpm test

      - name: Astro Check
        run: pnpm astro check

      - name: Build
        env:
          PUBLIC_CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_WEB_ANALYTICS_TOKEN || '' }}
        run: pnpm run build

      - name: Verify Cloudflare RUM when configured
        env:
          CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_WEB_ANALYTICS_TOKEN || '' }}
        run: |
          if [ -n "$CLOUDFLARE_WEB_ANALYTICS_TOKEN" ]; then
            grep -q 'static.cloudflareinsights.com/beacon.min.js' dist/index.html
            grep -q "$CLOUDFLARE_WEB_ANALYTICS_TOKEN" dist/index.html
          fi

      - name: Retain validated Pages build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: ccus-policy-hub-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  governed-data:
    name: Governed policy and database integrity
    needs: detect-scope
    if: needs.detect-scope.outputs.governed_data == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate derived content from SQLite SSOT
        run: pnpm gen

      - name: Verify byte-identical regeneration
        run: |
          hash_trees() {
            find src/content/policies src/content/facilities src/content/countries public/data src/data/dataset_versions.json src/data/i18n_dictionary.json src/data/quality_metrics.generated.json -type f | sort | xargs sha256sum
          }
          hash_trees > /tmp/gen-a.txt
          pnpm gen > /dev/null
          hash_trees > /tmp/gen-b.txt
          diff /tmp/gen-a.txt /tmp/gen-b.txt

      - name: Deep Audit (blocking)
        run: pnpm manage:db:audit:deep

      - name: Verify Policy Consistency (DB vs regenerated Markdown)
        run: pnpm manage:db:audit:policy-consistency

      - name: Verify Facilities Parity
        run: pnpm check:facilities-parity

      - name: Verify Policy Coverage Matrix
        run: |
          pnpm manage:db:audit:policy-coverage
          pnpm prettier --write \
            docs/policy-coverage-matrix.md \
            docs/policy-coverage-matrix.json
          git diff --exit-code -- docs/policy-coverage-matrix.md
          rm -f docs/policy-coverage-matrix.json

      - name: Verify Policy Content Depth Report
        run: |
          pnpm manage:db:audit:policy-content-depth
          pnpm prettier --write \
            docs/policy-content-depth-report.json \
            docs/policy-content-depth-report.md
          git diff --exit-code -- \
            docs/policy-content-depth-report.json \
            docs/policy-content-depth-report.md

      - name: Require stable governance reports to remain current
        run: |
          git diff --exit-code -- \
            docs/policy-db-consistency-report.json \
            docs/policy-db-consistency-report.md \
            docs/policy-coverage-matrix.md \
            docs/policy-content-depth-report.json \
            docs/policy-content-depth-report.md
