name: Verified policy source retrieval batch 05
on:
  push:
    paths:
      - '.github/workflows/archive_manual_batch05.yml'
      - 'tools/source_archive/manual_acquisition_batch05.csv'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/archive_manual_batch05.yml'
      - 'tools/source_archive/manual_acquisition_batch05.csv'
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Acquire original bytes and record hashes
        run: POLICY_OUTPUT=policy_source_evidence_batch05 python tools/source_archive/manual_acquire_batch04.py tools/source_archive/manual_acquisition_batch05.csv
      - name: Preserve acquired evidence for review
        uses: actions/upload-artifact@v4
        with:
          name: policy-source-evidence-batch05
          path: policy_source_evidence_batch05/
          retention-days: 7
          if-no-files-found: error
