name: Deploy to GitHub Pages

on:
  workflow_run:
    # CI produces the validated dist artifact. "Sync ESG30 report" commits freshly
    # synced report content to main but uploads no artifact, so it is routed to the
    # build-from-main path below instead of the artifact download.
    workflows: [CI, Sync ESG30 report]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') || github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download validated CI build
        if: github.event_name == 'workflow_run' && github.event.workflow_run.name == 'CI'
        uses: actions/download-artifact@v6
        with:
          name: ccus-policy-hub-dist
          path: dist
          github-token: ${{ github.token }}
          repository: liuh886/ccus-policy-hub
          run-id: ${{ github.event.workflow_run.id }}

      - name: Build current main from source
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.name != 'CI')
        shell: bash
        env:
          PUBLIC_CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_WEB_ANALYTICS_TOKEN || '' }}
        run: |
          git clone --depth=1 --branch main https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git repository
          cd repository
          corepack enable
          corepack prepare pnpm@9 --activate
          pnpm install --frozen-lockfile
          pnpm gen
          pnpm build
          cp -R dist ../dist

      - name: Verify deployment artifact
        run: |
          test -f dist/index.html
          test -d dist/_astro
          if [ -n "${{ vars.CLOUDFLARE_WEB_ANALYTICS_TOKEN || '' }}" ]; then
            grep -q 'static.cloudflareinsights.com/beacon.min.js' dist/index.html
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
