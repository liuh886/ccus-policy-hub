name: Manual primary policy acquisition batch 08
on:
  push:
    paths:
      - '.github/workflows/archive_manual_batch08.yml'
      - 'tools/source_archive/manual_acquisition_batch08.csv'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/archive_manual_batch08.yml'
      - 'tools/source_archive/manual_acquisition_batch08.csv'
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve source bytes and SHA-256 without legal auto-approval
        run: POLICY_OUTPUT=policy_source_evidence_batch08 python tools/source_archive/manual_acquire_batch08.py tools/source_archive/manual_acquisition_batch08.csv
      - name: Upload original evidence and manifest
        uses: actions/upload-artifact@v4
        with:
          name: policy-source-evidence-batch08
          path: policy_source_evidence_batch08/
          retention-days: 7
          if-no-files-found: error
